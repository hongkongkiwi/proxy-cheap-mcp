[package]
name = "proxy-cheap-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CLI and MCP server (stdio, HTTP, SSE) for the Proxy-Cheap API"
license = "MIT"
repository = "https://github.com/hongkongkiwi/proxy-cheap-mcp"
homepage = "https://github.com/hongkongkiwi/proxy-cheap-mcp"
readme = "README.md"
keywords = ["mcp", "proxy-cheap", "proxies", "cli", "ai"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "proxy-cheap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.23.1"
bytes = "1"
chromiumoxide = "0.9.1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
hmac = "0.12"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
